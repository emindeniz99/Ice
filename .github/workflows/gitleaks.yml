# Hardened per Astral's open-source security guide
# (https://astral.sh/blog/open-source-security-at-astral):
# pinned-to-SHA third-party actions, default-deny permissions,
# strict bash defaults, no pull_request_target / workflow_run.

# gitleaks is a static secret scanner
# (https://github.com/gitleaks/gitleaks). It scans the full git
# history for committed credentials (cloud keys, tokens, private
# keys, etc.) so a leaked secret can't quietly sit in an old commit.

name: Gitleaks

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly full-history rescan on Mondays so a leak that slipped
    # past a fast-forward push gets picked up eventually.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # so SARIF lands in code scanning
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          # The license is for GITLEAKS_ENTERPRISE only; the open-source
          # action runs fine without it. Set if you have one.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: ""           # use defaults
        continue-on-error: true     # advisory during initial rollout

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a  # codeql-bundle-v2.25.4
        with:
          sarif_file: results.sarif
          category: gitleaks
        continue-on-error: true
