# Hardened per Astral's open-source security guide
# (https://astral.sh/blog/open-source-security-at-astral):
# pinned-to-SHA third-party actions, default-deny permissions,
# strict bash defaults, no pull_request_target / workflow_run.

# zizmor is a static analyzer for GitHub Actions workflows
# (https://github.com/woodruffw/zizmor). It catches expression
# injection, dangerous triggers, missing permissions, unpinned
# actions, and other supply-chain-relevant misconfigurations.
# Running it on every push / PR keeps new workflows honest.

name: Zizmor audit

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  zizmor:
    name: zizmor audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # so SARIF upload lands in code-scanning
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv (used to run zizmor without a separate install step)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Run zizmor
        run: |
          uvx --from zizmor zizmor \
            --persona=auditor \
            --format sarif \
            --output zizmor.sarif \
            .github/workflows
        # Don't fail the build on findings during the initial rollout —
        # the SARIF upload below surfaces them in the GitHub Security tab
        # without blocking. Remove `continue-on-error` once the backlog
        # has been triaged.
        continue-on-error: true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a  # codeql-bundle-v2.25.4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
